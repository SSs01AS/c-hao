<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>陈好专属点餐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *{font-family:"微软雅黑",sans-serif;}
        .menu-item{transition:0.25s all;cursor:pointer;padding:8px 6px;border-radius:8px;margin:3px 0;}
        .menu-item:hover{background:#fef0e6;transform:translateX(3px);}
        .active-menu{background:#ffe8d6;color:#ff6b6b;font-weight:bold;border-left:3px solid #ff6b6b;padding-left:8px;}
        .content-box img{max-width:100%;height:auto;margin:0 auto;display:block;border-radius:16px;}
    </style>
</head>
<body class="bg-[#f9f7f2] max-w-[420px] mx-auto my-3 rounded-2xl overflow-hidden bg-white border border-gray-200 shadow-lg">
    <!-- 顶部封面 -->
    <div>
        <img src="https://raw.githubusercontent.com/Sss01AS/c-hao/main/OIP-C(1).jpg" 
             class="w-full h-[220px] object-cover"
             onerror="this.src='https://placehold.co/400x220?text=陈好专属'">
        <div class="py-3 text-center text-black font-bold text-xl tracking-wider">
            =☐ω☐= 陈好专属 =☐ω☐=
        </div>
    </div>

    <div class="flex">
        <!-- 左侧菜单 -->
        <div class="w-[35%] bg-[#fff7ef] py-3 px-2 flex flex-col">
            <div class="font-bold text-lg pl-2 mb-3 border-l-4 border-orange-400">菜单列表</div>
            <div class="menu-item" data-tab="notice">📌 下单须知</div>
            <div class="menu-item" data-tab="milk">🥤 点奶茶</div>
            <div class="menu-item" data-tab="eat">🍚 吃饭</div>
            <div class="menu-item" data-tab="snack">🍪 吃零食</div>
            <div class="menu-item text-red-500 mt-3" data-tab="waste">❌ 拒绝浪费</div>
            <div class="menu-item text-rose-400" data-tab="suggest">❤️ 投诉&介意</div>
        </div>

        <!-- 右侧内容区 -->
        <div class="w-[65%] p-3 min-h-[380px] flex flex-col items-center justify-start">
            <div id="notice" class="content-box text-center w-full">
                <div class="text-lg font-bold mb-3">📢下单须知</div>
                <p class="text-gray-600 text-sm">按需点餐，理性消费<br>爱惜粮食，拒绝铺张浪费</p>
            </div>

            <div id="milk" class="content-box hidden text-center w-full">
                <img src="https://raw.githubusercontent.com/Sss01AS/c-hao/main/166c08a5ae17ce.jpg" 
                     class="w-[180px] mx-auto shadow-md"
                     onerror="this.src='https://placehold.co/180x180?text=奶茶'">
                <div class="mt-3 font-medium">🥤 奶茶套餐</div>
                <p class="text-xs text-gray-500">香浓丝滑 · 定制甜度</p>
            </div>

            <div id="eat" class="content-box hidden text-center w-full">
                <img src="https://raw.githubusercontent.com/Sss01AS/c-hao/main/v2-c6add65a83a32d6e43fc49aa996b9206_r.jpg" 
                     class="w-[180px] mx-auto shadow-md"
                     onerror="this.src='https://placehold.co/180x180?text=正餐'">
                <div class="mt-3 font-medium">🍚 能量正餐</div>
                <p class="text-xs text-gray-500">营养均衡 · 美味管饱</p>
            </div>

            <div id="snack" class="content-box hidden text-center w-full">
                <img src="https://raw.githubusercontent.com/Sss01AS/c-hao/main/OIP-C(2).jpg" 
                     class="w-[180px] mx-auto shadow-md"
                     onerror="this.src='https://placehold.co/180x180?text=零食'">
                <div class="mt-3 font-medium">🍪 休闲零食</div>
                <p class="text-xs text-gray-500">解馋小食 · 快乐加倍</p>
            </div>

            <div id="waste" class="content-box hidden text-center w-full">
                <div class="text-red-500 font-bold text-lg">❌ 拒绝浪费</div>
                <p class="text-sm text-gray-500 mt-2">吃多少点多少，杜绝浪费粮食</p>
            </div>

            <div id="suggest" class="content-box hidden text-center w-full">
                <div class="text-rose-400 font-bold text-lg">❤️ 投诉&介意反馈</div>
                <p class="text-sm text-gray-500 mt-2">有任何不满意随时反馈调整</p>
            </div>
        </div>
    </div>

    <div class="text-center text-[10px] text-gray-400 py-3 border-t border-gray-100">
        按需点餐 · 陈好专属快乐星球
    </div>

    <script>
        function switchToTab(tabId, activeElement) {
            document.querySelectorAll('.content-box').forEach(box => box.classList.add('hidden'));
            document.getElementById(tabId)?.classList.remove('hidden');
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active-menu'));
            if (activeElement) activeElement.classList.add('active-menu');
        }

        document.querySelectorAll('.menu-item').forEach(item => {
            const text = item.innerText;
            let tabId = '';
            if (text.includes('下单须知')) tabId = 'notice';
            else if (text.includes('奶茶')) tabId = 'milk';
            else if (text.includes('吃饭')) tabId = 'eat';
            else if (text.includes('零食')) tabId = 'snack';
            else if (text.includes('拒绝浪费')) tabId = 'waste';
            else if (text.includes('投诉') || text.includes('介意')) tabId = 'suggest';
            if (tabId) item.setAttribute('data-tab', tabId);
            
            item.addEventListener('click', function() {
                const targetTab = this.getAttribute('data-tab');
                if (targetTab) switchToTab(targetTab, this);
            });
        });
        
        const defaultMenu = document.querySelector('.menu-item[data-tab="notice"]');
        if (defaultMenu) switchToTab('notice', defaultMenu);
    </script>
</body>
</html>
